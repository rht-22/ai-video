# 한국어 폰트 → 일본어 폰트 매핑.
# render.py 가 detect 단계 스타일(굵기/크기/serif 여부)로 적절한 일본어 폰트를 고른다.
# 파일은 paths.fonts_dir 기준 상대경로 또는 절대경로.
# ⚠ 상업 채널: 폰트 라이선스(임베딩·방송 사용) 반드시 확인. Noto Sans/Serif JP 는 OFL(상업 가능).
#
# ⚠ ai-video 이식(P4, 2026-08-25): **파일을 레포에 번들했다.** vlp 는 fonts/ 를 gitignore
# 하고 README 의 curl 로 각자 받게 했는데, 그래서 실측 노드에 파일이 없어 **양쪽 엔진이
# 조용히 기본 폰트로 떨어졌다**(일본어가 두부가 된다). ai-video 는 한국어 폰트를 이미
# 번들하므로 같은 규약으로 맞춘다 — OFL 이라 재배포에 문제가 없다.
# 출처는 Google Fonts(TTF)라 확장자가 .ttf 다. vlp README 의 noto-cjk OTF 와 **같은
# 서체·같은 웨이트**이고, PIL·libass 는 두 형식을 모두 읽는다(실측: 일본어 렌더 확인).

default: NotoSansJP-Bold.ttf        # 룰 매칭 실패 시
fallback: NotoSansJP-Regular.ttf    # default 파일도 없을 때

# 위에서부터 첫 매칭 사용. match 의 각 조건(weight/style/size_min/size_max)은 모두 선택.
# 실파일 = app/assets/fonts/ 번들(OFL). 위 ⚠ 참조.
rules:
  - name: heavy-caption             # 굵은 밈 자막
    match: { weight: bold }
    jp_font: NotoSansJP-Black.ttf
  - name: title-serif               # 제목/감성 컷
    match: { style: serif }
    jp_font: NotoSerifJP-Bold.ttf
  - name: small-body
    match: { size_max: 28 }
    jp_font: NotoSansJP-Medium.ttf
